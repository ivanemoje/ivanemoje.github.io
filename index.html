<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivan Emoje</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            padding: 60px 80px;
            line-height: 1.6;
        }
        
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 40px;
            border: 3px solid #333;
        }
        
        h1 {
            font-size: 3.2rem;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #a0a0a0;
            margin-bottom: 35px;
        }
        
        .info-row {
            display: flex;
            gap: 40px;
            font-size: 1.1rem;
            color: #d0d0d0;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, #333 0%, #333 100%);
            margin: 40px 0;
        }
        
        h2 {
            font-size: 2.2rem;
            font-weight: 500;
            margin-bottom: 25px;
        }
        
        .cta-text {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin-bottom: 35px;
        }
        
        .contact-links {
            display: flex;
            gap: 50px;
            font-size: 1.15rem;
            flex-wrap: wrap;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e0e0e0;
            text-decoration: none;
        }
        
        .contact-item:hover {
            color: #ffffff;
        }
        
        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <img src="/images/profile.jpg" alt="Profile" class="profile-pic">
    
    <h1>Hi. I'm Ivan Emoje</h1>
    
    <p class="subtitle">I'm a software engineer and entrepreneur with a focus on distributed systems, AI and startups</p>
    
    <div class="info-row">

        <div class="info-item">

    <div class="divider"></div>
